name: tiny-contamination-audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build contamination conditions
        run: |
          python scripts/make_overlap_conditions.py

      - name: Run contamination audit + tiny proxy eval
        run: |
          python scripts/eval_contamination.py

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: contamination-metrics
          path: outputs/metrics/*.json
